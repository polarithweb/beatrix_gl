name: Deploy Firestore Rules

on:
  push:
    branches:
      - main
      - master
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: Validate Firestore security rules
        run: npm run lint:rules

      - name: Check Firebase service account secret
        id: auth_check
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FIREBASE_SERVICE_ACCOUNT secret is not configured; skipping automated Firestore rules deployment."
          else
            printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Firestore rules
        if: steps.auth_check.outputs.configured == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: npx --yes firebase-tools@13 deploy --only firestore:rules --project grounded-bonfire-ms7sz --non-interactive

      - name: Clean up temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
